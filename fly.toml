app = "tilemall-redis"
primary_region = "syd"

[mounts]
  destination = "/data"
  source = "redis_server"

[metrics]
  port = 9091
  path = "/metrics"

# Use the Docker image instead of building from source

[build]
  # Pinned to the digest running on machine 328751dea03568 (2026-10-17), so a
  # deploy only changes configuration, never the Redis binary.
  image = "docker-hub-mirror.fly.io/flyio/redis@sha256:2a9f3376d0fb4663b390c801d66f43c72f68ada1c9a0d3e52586be709e64707e"

# Queue-safe persistence (BullMQ requires noeviction). start-redis-server.sh
# reads these; REDIS_PASSWORD comes from Fly secrets, never from this file.
# Enable AOF online (CONFIG SET appendonly yes) before the first deploy with
# APPENDONLY=yes, otherwise Redis starts from an empty or stale AOF.
[env]
  APPENDONLY = "yes"
  MAXMEMORY_POLICY = "noeviction"

# 1GB (Jun approved 2026-10-18): steady use is ~9MB (webhook snapshots, page
# metrics, the product-group queue); checkout rates no longer use this Redis.
# start-redis-server.sh sets maxmemory to 90% of this (~921MB).
[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

# Uncomment these lines for public internet access to Redis on port 10000
#
# [[services]]
# internal_port = 6379
# protocol      = "tcp"

#   [[services.ports]]
#   port     = "10000"

#   [[services.tcp_checks]]
